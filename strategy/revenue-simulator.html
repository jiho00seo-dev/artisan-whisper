<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passive Income Milestone Tracker 📈</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');
        
        :root {
            --bg: #0a0a0a;
            --text: #ffffff;
            --accent: #00ff88;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            padding: 40px 20px;
            line-height: 1.6;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        h1 { font-weight: 300; margin-bottom: 30px; }
        label { display: block; margin-top: 20px; color: #aaa; font-size: 0.9rem; }
        input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid #333;
            padding: 12px;
            border-radius: 10px;
            color: white;
            margin-top: 8px;
            box-sizing: border-box;
        }

        .result-box {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .stat { font-size: 2rem; font-weight: 600; color: var(--accent); }
        .stat-label { color: #888; font-size: 0.8rem; text-transform: uppercase; }

        .progress-bar {
            height: 10px;
            background: #222;
            border-radius: 5px;
            margin-top: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Passive Income<br>Simulator</h1>
            
            <label>Newsletter Subscribers</label>
            <input type="number" id="subs" value="100" oninput="calc()">

            <label>Avg. Conversion Rate (%)</label>
            <input type="number" id="conv" value="2" step="0.1" oninput="calc()">

            <label>Avg. Commission per Sale (KRW)</label>
            <input type="number" id="comm" value="5000" oninput="calc()">

            <div class="result-box">
                <div class="stat-label">Estimated Monthly Revenue</div>
                <div class="stat" id="revenue">₩0</div>
                
                <div class="stat-label" style="margin-top: 20px;">Progress to ₩1,000,000 Goal</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calc() {
            const subs = document.getElementById('subs').value;
            const conv = document.getElementById('conv').value / 100;
            const comm = document.getElementById('comm').value;
            
            const revenue = Math.floor(subs * conv * comm);
            document.getElementById('revenue').innerText = '₩' + revenue.toLocaleString();
            
            const progress = Math.min((revenue / 1000000) * 100, 100);
            document.getElementById('progress').style.width = progress + '%';
        }
        calc();
    </script>
</body>
</html>
