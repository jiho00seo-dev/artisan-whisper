<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Artisan's Whisper - Logo Concept</title>
    <style>
        body {
            background-color: #FDFCFB; /* Warm Sand */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Outfit', sans-serif;
            color: #2D3436; /* Deep Charcoal */
        }
        .logo-container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            border: 1px solid rgba(255,255,255,0.8);
        }
        svg {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            letter-spacing: 2px;
            margin: 0;
            font-weight: 500;
        }
        p {
            font-size: 14px;
            color: #8EE4AF; /* Muted Sage */
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Minimalist Scout's Mark SVG -->
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Magnifying Glass / Pen Nib Loop -->
            <path d="M40 70C56.5685 70 70 56.5685 70 40C70 23.4315 56.5685 10 40 10C23.4315 10 10 23.4315 10 40C10 56.5685 23.4315 70 40 70Z" stroke="#2D3436" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Handle as Pen Nib -->
            <path d="M62 62L85 85M85 85L92 88L88 92L85 85Z" stroke="#2D3436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M82 82L78 86" stroke="#2D3436" stroke-width="2" stroke-linecap="round"/>
            <!-- Gift Box Icon inside loop -->
            <rect x="33" x="35" width="10" height="10" stroke="#8EE4AF" stroke-width="2" rx="1"/>
            <path d="M33 38H43M38 33V43" stroke="#8EE4AF" stroke-width="1.5"/>
        </svg>
        
        <h1>Artisan's Whisper</h1>
        <p>아티잔의 속삭임</p>
    </div>

</body>
</html>
