<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artisan's Whisper | 아티잔의 속삭임 - 취향의 발견 (Mobile)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --charcoal: #2D3436;
            --sage: #8EE4AF;
            --sand: #FDFCFB;
            --glass: rgba(255, 255, 255, 0.6);
            --border: rgba(255, 255, 255, 0.3);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            --transition: all 0.4s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background: #FDFCFB;
            color: var(--charcoal);
            line-height: 1.6;
        }

        /* Mobile Layout */
        .mobile-wrapper {
            padding: 40px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-mark {
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .korean-title {
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: #636e72;
            font-weight: 300;
        }

        /* The Manifesto Box - Mobile Optimized */
        .manifesto-card {
            background: #f1f2f6;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            margin-bottom: 30px;
        }

        .manifesto-card p {
            font-size: 1rem;
            font-style: italic;
            color: var(--charcoal);
        }

        /* The Peek - Card Style */
        .peek-card {
            width: 100%;
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
            border: 1px solid #f1f1f1;
        }

        .peek-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .peek-info {
            padding: 25px;
        }

        .badge {
            font-size: 0.65rem;
            background: var(--sage);
            padding: 4px 10px;
            border-radius: 5px;
            font-weight: 700;
            margin-bottom: 10px;
            display: inline-block;
        }

        .peek-info h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .peek-info p {
            font-size: 0.9rem;
            color: #636e72;
            font-weight: 300;
        }

        /* Fixed Bottom Subscription Bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--charcoal); /* 다크 모드 톤으로 변경하여 대비감 확보 */
            padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
            box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
            z-index: 100;
            border-radius: 25px 25px 0 0;
        }

        .email-form {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            color: white;
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        button.submit {
            background: var(--sage); /* 로고와 어울리는 세이지 그린 포인트 */
            color: var(--charcoal);
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: clamp(0.9rem, 4vw, 1.1rem); /* 가변 폰트 사이즈로 한 줄 유지 */
            white-space: nowrap; /* 글자 줄바꿈 방지 */
            min-width: fit-content;
        }

        /* Texture Gallery Section */
        .gallery-header {
            width: 100%;
            text-align: left;
            margin-bottom: 15px;
            padding-left: 5px;
        }

        .gallery-header h4 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #b2bec3;
        }

        .gallery-scroll {
            display: flex;
            gap: 15px;
            width: 100%;
            overflow-x: auto;
            padding-bottom: 100px; /* Space for bottom bar */
            scrollbar-width: none;
        }

        .gallery-scroll::-webkit-scrollbar { display: none; }

        .gallery-item {
            min-width: 200px;
            height: 200px;
            border-radius: 20px;
            overflow: hidden;
            background: #eee;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Back to top / spacer */
        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #b2bec3;
            margin-top: 20px;
            margin-bottom: 120px;
        }

    </style>
</head>
<body>

    <div class="mobile-wrapper">
        <div class="header">
            <div class="logo-mark">
                <svg width="50" height="50" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M40 70C56.5685 70 70 56.5685 70 40C70 23.4315 56.5685 10 40 10C23.4315 10 10 23.4315 10 40C10 56.5685 23.4315 70 40 70Z" stroke="#2D3436" stroke-width="2.5"/>
                    <path d="M62 62L85 85M85 85L92 88L88 92L85 85Z" stroke="#2D3436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <rect x="35" y="35" width="10" height="10" stroke="#8EE4AF" stroke-width="2" rx="1"/>
                </svg>
            </div>
            <h1>Artisan's Whisper</h1>
            <div class="korean-title">아티잔의 속삭임</div>
        </div>

        <div class="manifesto-card">
            <p>"1,000명의 메이커 중 영혼이 담긴 단 1개의 작품만을 속삭입니다."</p>
        </div>

        <a href="https://www.idus.com/v2/product/ce494629-4588-4764-a31d-45e58d9ba9a4" target="_blank" style="text-decoration: none; color: inherit; width: 100%;">
            <div class="peek-card">
                <img src="https://image.idus.com/image/files/f63ff0cf8ddc45aeae244e023bda97a3.jpg" class="peek-image" alt="Monitree">
                <div class="peek-info">
                    <div class="badge">ISSUE #1 PREVIEW</div>
                    <h3>모니터 위에서 자라는 숲</h3>
                    <p>당신의 시선 끝에 늘 숲이 머물기를. AI 스카우트의 첫 번째 발견.</p>
                </div>
            </div>
        </a>

        <div class="gallery-header">
            <h4>당신의 공간을 채울 영감의 질감들</h4>
        </div>
        <div class="gallery-scroll">
            <div class="gallery-item">
                <img src="https://image.idus.com/image/files/5811a994376f464099da489cc38fdc7b.png" alt="Incense">
            </div>
            <div class="gallery-item">
                <img src="https://image.idus.com/image/files/ef3b2aa48abe4a2ca54426245739a002.jpg" alt="Soban">
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1513519245088-0e12902e5a38?q=80&w=500&auto=format&fit=crop" alt="Desk">
            </div>
        </div>

        <div class="footer-note">
            &copy; 2026 Artisan's Whisper. All rights reserved.
        </div>
    </div>

    <!-- Bottom Subscription Bar -->
    <div class="bottom-bar">
        <div class="email-form">
            <input type="email" id="email-input-mobile" placeholder="이메일을 입력하세요">
            <button class="submit" id="subscribe-btn-mobile">구독</button>
        </div>
    </div>

</body>
</html>
