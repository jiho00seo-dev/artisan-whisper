<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장인의 갈무리 | Artisan Archive (Mobile)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --brand: #634235;
            /* Chocolate / Deep Earth */
            --brand-light: #B87333;
            /* Copper / Amber */
            --charcoal: #2D3436;
            --sand: #FAF9F6;
            --glass: rgba(255, 255, 255, 0.85);
            --border: rgba(99, 66, 53, 0.1);
            --shadow: 0 15px 45px rgba(99, 66, 53, 0.08);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background: var(--sand);
            color: var(--charcoal);
            line-height: 1.6;
            background: radial-gradient(circle at top left, #fdfcfb 0%, #f3e6dd 100%);
        }

        /* Mobile Layout */
        .mobile-wrapper {
            padding: 50px 24px 140px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-mark {
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 8px rgba(99, 66, 53, 0.1));
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--brand);
            letter-spacing: -0.5px;
        }

        .korean-title {
            font-size: 0.8rem;
            letter-spacing: 5px;
            color: var(--brand-light);
            font-weight: 400;
            text-transform: uppercase;
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            width: 100%;
            overflow-x: auto;
            padding: 5px;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: white;
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #636e72;
            white-space: nowrap;
            transition: var(--transition);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }

        .tab-btn.active {
            background: var(--brand);
            color: white;
            border-color: var(--brand);
            box-shadow: 0 8px 20px rgba(99, 66, 53, 0.2);
        }

        /* Main Display Area */
        #product-display {
            width: 100%;
            min-height: 400px;
        }

        /* The Peek - Premium Card Style */
        .peek-card {
            width: 100%;
            background: white;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            border: 1px solid rgba(0, 0, 0, 0.03);
            transition: var(--transition);
            display: block;
            text-decoration: none;
            color: inherit;
        }

        .peek-image {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .peek-info {
            padding: 24px;
        }

        .badge {
            font-size: 0.65rem;
            background: var(--brand-light);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            margin-bottom: 10px;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .peek-info h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--brand);
        }

        .peek-info p {
            font-size: 0.9rem;
            color: #636e72;
            font-weight: 300;
            line-height: 1.6;
        }

        /* Bottom Fixed Bar */
        .bottom-bar {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: var(--brand);
            padding: 15px 18px;
            box-shadow: 0 20px 50px rgba(63, 42, 33, 0.3);
            z-index: 100;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .email-form {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: center;
        }

        input {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            color: white;
            font-family: inherit;
            min-width: 0;
            /* Prevents input from pushing button out */
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        button.submit {
            background: var(--brand-light);
            color: white;
            border: none;
            padding: 0 18px;
            height: 48px;
            border-radius: 12px;
            font-weight: 700;
            /* representative's request: dynamic font size for 1-line text */
            font-size: clamp(0.85rem, 3.5vw, 1rem);
            white-space: nowrap;
            flex-shrink: 0;
            transition: var(--transition);
        }

        button.submit:active {
            transform: scale(0.96);
        }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #b2bec3;
            margin-top: 20px;
        }

        /* Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.5s forwards;
        }
    </style>
</head>

<body>

    <div class="mobile-wrapper">
        <div class="header">
            <div class="logo-mark">
                <svg width="50" height="50" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M40 70C56.5685 70 70 56.5685 70 40C70 23.4315 56.5685 10 40 10C23.4315 10 10 23.4315 10 40C10 56.5685 23.4315 70 40 70Z"
                        stroke="#2D3436" stroke-width="2.5" />
                    <path d="M62 62L85 85M85 85L92 88L88 92L85 85Z" stroke="#2D3436" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round" />
                    <rect x="35" y="35" width="10" height="10" stroke="#634235" stroke-width="2" rx="1" />
                </svg>
            </div>
            <h1>장인의 갈무리</h1>
            <div class="korean-title">Artisan Archive</div>
        </div>

        <div class="category-tabs">
            <button class="tab-btn active" onclick="loadProducts('all')">전체</button>
            <button class="tab-btn" onclick="loadProducts('men30')">서재</button>
            <button class="tab-btn" onclick="loadProducts('natural')">자연</button>
            <button class="tab-btn" onclick="loadProducts('gift')">선물</button>
        </div>

        <div id="product-display">
            <!-- Dynamic Content -->
        </div>

        <div class="footer-note">
            &copy; 2026 장인의 갈무리. All rights reserved.
        </div>
    </div>

    <!-- Bottom Subscription Bar -->
    <div class="bottom-bar">
        <div class="email-form">
            <input type="email" id="email-input-mobile" placeholder="소식지 구독 (이메일)">
            <button class="submit" id="subscribe-btn-mobile">갈무리</button>
        </div>
    </div>

    <script src="assets/curation-data.js"></script>
    <script>
        function loadProducts(persona) {
            // Update tabs
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                tab.classList.remove('active');
                if (tab.innerText === getCategoryLabel(persona)) {
                    tab.classList.add('active');
                }
            });

            const display = document.getElementById('product-display');
            const data = window.getCurationData(persona);

            display.innerHTML = '';

            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'animate-in';
                card.style.animationDelay = `${index * 0.1}s`;
                card.innerHTML = `
                    <a href="${item.url}" class="peek-card">
                        <img src="${item.img}" class="peek-image" alt="${item.title}">
                        <div class="peek-info">
                            <div class="badge">${item.tag || 'CURATED'}</div>
                            <h3>${item.title}</h3>
                            <p>${item.desc}</p>
                        </div>
                    </a>
                `;
                display.appendChild(card);
            });
        }

        function getCategoryLabel(persona) {
            const labels = { 'all': '전체', 'men30': '서재', 'natural': '자연', 'gift': '선물' };
            return labels[persona];
        }

        // Initial Load
        window.onload = () => loadProducts('all');
    </script>
</body>

</html>
